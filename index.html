<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D1420; --panel:#121B29; --panel-raised:#16212F; --hair:#28394D;
    --paper:#E8E4DA; --paper-dim:#9AA4B2; --slate:#7C8798;
    --brass:#C98A3D; --brass-dim:#8A6230; --teal:#3E8577; --rust:#B0503C;
  }
  *{box-sizing:border-box;}
  body{background:var(--ink);color:var(--paper);font-family:'Inter',-apple-system,sans-serif;margin:0;min-height:100vh;}
  .cc-wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}
  .cc-topbar{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--hair);padding-bottom:18px;margin-bottom:22px;}
  .cc-title{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;letter-spacing:-0.01em;color:var(--paper);}
  .cc-sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--slate);margin-top:4px;}
  .cc-date{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--brass);text-align:right;}
  .cc-date div:last-child{color:var(--slate);margin-top:2px;}
  .cc-gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);margin-bottom:24px;}
  .cc-gauge{background:var(--panel);padding:16px 18px;}
  .cc-gauge-num{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;color:var(--paper);line-height:1;}
  .cc-gauge-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--slate);margin-top:6px;letter-spacing:0.03em;}
  .cc-brief{border:1px solid var(--hair);background:var(--panel);padding:16px 18px;margin-bottom:28px;display:flex;justify-content:space-between;align-items:center;gap:16px;}
  .cc-brief-text{font-size:13px;color:var(--paper-dim);line-height:1.5;}
  .cc-brief-text b{color:var(--paper);font-weight:600;}
  .cc-tier{margin-bottom:30px;}
  .cc-tier-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--hair);}
  .cc-tier-name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--paper);}
  .cc-tier-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--slate);}
  .cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);}
  .cc-card{background:var(--panel);padding:16px 18px 14px;position:relative;}
  .cc-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .cc-card-name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--paper);}
  .cc-card-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--slate);}
  .cc-health{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .cc-health-bar{flex:1;height:4px;background:var(--hair);position:relative;}
  .cc-health-fill{height:100%;transition:width .2s;}
  .cc-health-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--slate);width:52px;text-align:right;}
  .cc-status-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .cc-status-pill{font-family:'JetBrains Mono',monospace;font-size:9.5px;padding:3px 8px;border:1px solid var(--hair);color:var(--slate);cursor:pointer;background:transparent;}
  .cc-field-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--slate);margin-bottom:3px;margin-top:8px;letter-spacing:0.02em;}
  .cc-field-input{width:100%;background:var(--panel-raised);border:1px solid var(--hair);color:var(--paper);font-family:'Inter',sans-serif;font-size:12.5px;padding:6px 8px;resize:none;}
  .cc-field-input:focus{outline:none;border-color:var(--brass-dim);}
  .cc-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
  .cc-updated{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--slate);}
  .cc-remove{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--slate);background:none;border:none;cursor:pointer;}
  .cc-remove:hover{color:var(--rust);}
  .cc-add-row{margin-top:14px;}
  .cc-add-btn{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--slate);border:1px dashed var(--hair);background:transparent;padding:10px 14px;width:100%;cursor:pointer;text-align:left;}
  .cc-save-note{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--slate);text-align:right;margin-top:10px;height:14px;}
  .cc-setup{max-width:520px;margin:80px auto;padding:24px;border:1px solid var(--hair);background:var(--panel);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;color:var(--paper-dim);}
  .cc-setup b{color:var(--paper);}
  .cc-setup code{color:var(--brass);background:var(--panel-raised);padding:1px 5px;}
  @media (max-width:640px){
    .cc-gauges{grid-template-columns:repeat(2,1fr);}
    .cc-grid{grid-template-columns:1fr;}
    .cc-topbar{flex-direction:column;align-items:flex-start;gap:8px;}
    .cc-date{text-align:left;}
    .cc-brief{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useCallback} = React;

// ---- CONFIG: paste your Supabase project values here ----
const SUPABASE_URL = "https://btksicoeaavbltpyfvld.supabase.co/rest/v1/";       // e.g. https://xxxx.supabase.co
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0a3NpY29lYWF2Ymx0cHlmdmxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDk5NzksImV4cCI6MjEwMzc4NTk3OX0.PrsqEKN-wv6WVSh1cbrKYxs4i8y1LkmHXTuw0uXlggE";
// -----------------------------------------------------------

const NEEDS_SETUP = SUPABASE_URL.startsWith("YOUR_") || SUPABASE_ANON_KEY.startsWith("YOUR_");
const supabase = NEEDS_SETUP ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS = [
  {key:'active', label:'active', color:'#3E8577'},
  {key:'planning', label:'planning', color:'#C98A3D'},
  {key:'on-hold', label:'on hold', color:'#7C8798'},
  {key:'blocked', label:'blocked', color:'#B0503C'},
];

const DEFAULT_PROJECTS = [
  {id:'lacita', name:'Lacita', num:'01', tier:1, descr:'Booking app integrated with ATH M\u00f3vil', status:'planning', health:55, next_action:'Re-scope where the build was paused and confirm ATH M\u00f3vil integration requirements', notes:'Started last year, paused for work. Picking back up.'},
  {id:'bo-ai', name:'Business Owners AI Problem Solvers', num:'02', tier:1, descr:'AI/data solutions for $10-50M businesses; Josefina as flagship use case', status:'planning', health:40, next_action:'Get the video reference and first scenarios to start building the Josefina model', notes:'Client-facing proof of concept for the whole consulting offer.'},
  {id:'ai-invest', name:'AI Investment Experiment', num:'03', tier:1, descr:'$3,000 live test \u2014 which AI-driven model grows capital fastest', status:'planning', health:60, next_action:'Define the models to compete, funding split, and tracking method', notes:''},
  {id:'golf-sim', name:'Mobile Golf Simulator', num:'04', tier:2, descr:'Mobile golf simulator business', status:'on-hold', health:0, next_action:'Revisit once projects 1-3 are stable', notes:'Deliberately deprioritized.'},
  {id:'porta-potty', name:'Luxury Porta Potty', num:'05', tier:3, descr:'Testing PR market demand for luxury portable restrooms', status:'planning', health:20, next_action:'Size the PR market and identify a first event or client to pilot with', notes:''},
  {id:'bstock', name:'B-Stock', num:'06', tier:3, descr:'Approved-buyer liquidation pallets + AI platform for inventory, dynamic pricing, shipping', status:'planning', health:25, next_action:'Buy a first test pallet once approved, and scope the AI platform architecture', notes:'Buyer application already submitted.'},
  {id:'real-estate', name:'Real Estate with Inversionistas', num:'07', tier:3, descr:'PR auction properties with outside investors', status:'planning', health:15, next_action:'Check PR auction access costs and reach out to Endeavor Capital as a potential investor', notes:''},
  {id:'small-biz', name:'Small Business Purchase', num:'08', tier:3, descr:'Acquire an existing small business using lender financing', status:'planning', health:10, next_action:"Research Codie S\u00e1nchez's acquisition approach and shortlist lenders", notes:''},
];

const TIER_LABELS = {1:'Tier 1 \u2014 Active priority', 2:'Tier 2 \u2014 On hold', 3:'Tier 3 \u2014 Exploratory'};

function healthColor(h){ if(h>=60) return '#3E8577'; if(h>=30) return '#C98A3D'; return '#B0503C'; }

function SetupNotice(){
  return (
    <div className="cc-setup">
      <div style={{marginBottom:'12px'}}><b>Command Center isn't connected to a database yet.</b></div>
      <div>1. Create a free project at <b>supabase.com</b></div>
      <div>2. In SQL Editor, run the <code>schema.sql</code> file that came with this site</div>
      <div>3. In Project Settings &gt; API, copy your <code>Project URL</code> and <code>anon public</code> key</div>
      <div>4. Paste them into <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of <code>index.html</code></div>
      <div>5. Redeploy</div>
    </div>
  );
}

function Card({p, onChange, onRemove}){
  const [local, setLocal] = useState(p);
  useEffect(()=>setLocal(p), [p]);
  const commit = (field, value) => {
    const updated = {...local, [field]: value};
    setLocal(updated);
    onChange(updated);
  };
  return (
    <div className="cc-card">
      <div className="cc-card-top">
        <div className="cc-card-name">{local.name}</div>
        <div className="cc-card-num">{local.num}</div>
      </div>
      <div className="cc-health">
        <div className="cc-health-bar"><div className="cc-health-fill" style={{width: local.health+'%', background: healthColor(local.health)}}></div></div>
        <div className="cc-health-label">{local.health}% health</div>
      </div>
      <input type="range" min="0" max="100" value={local.health}
        onChange={e=>commit('health', parseInt(e.target.value))}
        style={{width:'100%', marginBottom:'8px', accentColor: healthColor(local.health)}} />
      <div className="cc-status-row">
        {STATUS.map(s=>(
          <button key={s.key} className="cc-status-pill"
            style={local.status===s.key ? {background:s.color, borderColor:s.color, color:'#0D1420'} : {}}
            onClick={()=>commit('status', s.key)}>{s.label}</button>
        ))}
      </div>
      <div className="cc-field-label">what it is</div>
      <textarea className="cc-field-input" rows="2" value={local.descr}
        onChange={e=>setLocal({...local, descr:e.target.value})}
        onBlur={e=>commit('descr', e.target.value)} />
      <div className="cc-field-label">next action</div>
      <textarea className="cc-field-input" rows="2" value={local.next_action}
        onChange={e=>setLocal({...local, next_action:e.target.value})}
        onBlur={e=>commit('next_action', e.target.value)} />
      <div className="cc-field-label">notes</div>
      <textarea className="cc-field-input" rows="2" value={local.notes}
        onChange={e=>setLocal({...local, notes:e.target.value})}
        onBlur={e=>commit('notes', e.target.value)} />
      <div className="cc-card-footer">
        <div className="cc-updated">{local.updated_at ? 'updated ' + new Date(local.updated_at).toLocaleDateString() : ''}</div>
        <button className="cc-remove" onClick={()=>onRemove(local.id)}>remove</button>
      </div>
    </div>
  );
}

function App(){
  const [projects, setProjects] = useState(null);
  const [saveState, setSaveState] = useState('');

  useEffect(()=>{
    if(NEEDS_SETUP) return;
    (async ()=>{
      const {data, error} = await supabase.from('projects').select('*').order('num');
      if(error){ console.error(error); setProjects([]); return; }
      if(data && data.length){ setProjects(data); }
      else {
        // first run: seed the table
        await supabase.from('projects').upsert(DEFAULT_PROJECTS);
        setProjects(DEFAULT_PROJECTS);
      }
    })();
  }, []);

  const updateProject = async (updated) => {
    setProjects(prev => prev.map(p => p.id===updated.id ? updated : p));
    setSaveState('saving...');
    const {error} = await supabase.from('projects').update({
      name: updated.name, tier: updated.tier, descr: updated.descr, status: updated.status,
      health: updated.health, next_action: updated.next_action, notes: updated.notes,
      updated_at: new Date().toISOString()
    }).eq('id', updated.id);
    setSaveState(error ? 'save failed' : 'saved');
    setTimeout(()=>setSaveState(''), 1200);
  };

  const removeProject = async (id) => {
    setProjects(prev => prev.filter(p => p.id!==id));
    await supabase.from('projects').delete().eq('id', id);
  };

  const addProject = async () => {
    const name = window.prompt('Project name?');
    if(!name) return;
    const id = 'p_' + Date.now();
    const num = String(projects.length+1).padStart(2,'0');
    const row = {id, name, num, tier:3, descr:'', status:'planning', health:20, next_action:'', notes:''};
    setProjects(prev => [...prev, row]);
    await supabase.from('projects').insert(row);
  };

  if(NEEDS_SETUP) return <SetupNotice />;
  if(!projects) return <div className="cc-wrap"><div style={{color:'#7C8798', fontFamily:'JetBrains Mono, monospace', fontSize:'12px'}}>loading command center...</div></div>;

  const active = projects.filter(p=>p.status==='active').length;
  const blocked = projects.filter(p=>p.status==='blocked').length;
  const avgHealth = projects.length ? Math.round(projects.reduce((a,p)=>a+p.health,0) / projects.length) : 0;
  const tiers = [1,2,3].map(t => ({tier:t, items: projects.filter(p=>p.tier===t)})).filter(t=>t.items.length>0);
  const today = new Date();
  const dateStr = today.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});

  return (
    <div className="cc-wrap">
      <div className="cc-topbar">
        <div>
          <div className="cc-title">Command Center</div>
          <div className="cc-sub">portfolio operations \u2014 {projects.length} ventures tracked</div>
        </div>
        <div className="cc-date"><div>{dateStr}</div></div>
      </div>
      <div className="cc-gauges">
        <div className="cc-gauge"><div className="cc-gauge-num">{projects.length}</div><div className="cc-gauge-label">total ventures</div></div>
        <div className="cc-gauge"><div className="cc-gauge-num" style={{color:'#3E8577'}}>{active}</div><div className="cc-gauge-label">active</div></div>
        <div className="cc-gauge"><div className="cc-gauge-num" style={{color: blocked>0 ? '#B0503C' : '#E8E4DA'}}>{blocked}</div><div className="cc-gauge-label">blocked</div></div>
        <div className="cc-gauge"><div className="cc-gauge-num" style={{color: healthColor(avgHealth)}}>{avgHealth}%</div><div className="cc-gauge-label">avg. portfolio health</div></div>
      </div>
      <div className="cc-brief">
        <div className="cc-brief-text"><b>Daily briefing</b> lives in Claude, not here \u2014 ask Claude for today's news/market update and status changes there, then reflect them here.</div>
      </div>
      {tiers.map(({tier, items}) => (
        <div className="cc-tier" key={tier}>
          <div className="cc-tier-head">
            <div className="cc-tier-name">{TIER_LABELS[tier]}</div>
            <div className="cc-tier-count">{items.length} {items.length===1?'venture':'ventures'}</div>
          </div>
          <div className="cc-grid">
            {items.map(p => <Card key={p.id} p={p} onChange={updateProject} onRemove={removeProject} />)}
          </div>
        </div>
      ))}
      <div className="cc-add-row"><button className="cc-add-btn" onClick={addProject}>+ add a venture</button></div>
      <div className="cc-save-note">{saveState}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
